[project]
name = "brainweb-fisher-kpp"
version = "1.0.0"
description = "Standalone, conservative 3-D Fisher–KPP exploration on BrainWeb"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "nibabel>=5.3,<6",
  "numba>=0.61,<1", "matplotlib>=3.9,<4", "ipywidgets>=8.1,<9",
  "ipympl>=0.9,<1", "jupyterlab>=4.3,<5", "nbformat>=5.10,<6",
  "nbclient>=0.10,<1", "imageio>=2.36,<3", "imageio-ffmpeg>=0.6,<1",
  "pillow>=11,<13", "pytest>=8,<10",
]

[project.scripts]
brainweb-kpp = "brainweb_kpp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainweb_kpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
